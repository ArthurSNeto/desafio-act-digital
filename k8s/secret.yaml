apiVersion: v1
kind: Secret
metadata:
  name: library-api-secret
  labels:
    app.kubernetes.io/name: library-api
    app.kubernetes.io/component: backend
type: Opaque
stringData:
  # Para execução local no cluster Kubernetes/Kind com o Docker Compose do host:
  # O IP 172.19.0.1 é o gateway da rede Docker do cluster Kind para a máquina host.
  ConnectionStrings__PostgreSql: "Host=172.19.0.1;Port=5432;Database=library_db;Username=postgres;Password=postgres"
  ConnectionStrings__Redis: "172.19.0.1:6379"
